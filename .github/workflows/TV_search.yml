name: 构建 live.txt

on:
  workflow_dispatch:
  push:
    paths:
      - live.txt
      - build_live.py
      - .github/workflows/TV_search.yml
  schedule:
    # 每 2 小时跑一次（UTC 整点：0 */2 * * *）
    # 北京时间 = UTC+8，所以对应 08:00、10:00、12:00 … 次日 06:00
    - cron: '0 */2 * * *'

permissions:
  contents: write

concurrency:
  group: build-live
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build live.txt
        # 脚本内部会拉取作者订阅地址，失败自动退回本地 live.txt
        run: python build_live.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- live.txt; then
            echo 'live.txt 无变化，跳过提交'
          else
            git add live.txt
            # [skip ci] 避免机器人提交再次触发工作流
            git commit -m "chore: 自动整理 live.txt [skip ci]"
            git push
          fi
