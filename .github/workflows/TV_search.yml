name: 构建 live.txt

on:
  workflow_dispatch:
  push:
    paths:
      - live.txt
      - build_live.py
      - .github/workflows/TV_search.yml
  schedule:
    # UTC 18:30 = 北京时间 02:30，每天兜底跑一次
    - cron: '30 18 * * *'

permissions:
  contents: write

concurrency:
  group: build-live
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build live.txt
        run: python build_live.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- live.txt; then
            echo 'live.txt 无变化，跳过提交'
          else
            git add live.txt
            git commit -m "chore: 自动整理 live.txt"
            git push
          fi
